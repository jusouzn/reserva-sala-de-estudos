# Mantém dependências e actions atualizadas abrindo PRs automaticamente.
# Cada PR passa pelo mesmo pipeline de CI antes de poder ser mesclado.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ['dependencies']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels: ['ci']
